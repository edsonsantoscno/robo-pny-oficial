<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - CopyTrader PNY</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen text-white">

    <div class="bg-slate-800 p-8 rounded-lg shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-6 text-emerald-400">CopyTrader PNY</h2>
        <p class="text-slate-400 text-center text-sm mb-6">Entre para gerenciar suas chaves de API e acompanhar as operações.</p>

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">E-mail</label>
                <input type="email" name="email" required placeholder="seu@email.com" 
                       class="w-full p-3 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">Senha</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full p-3 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:border-emerald-500">
            </div>

            <button type="submit" 
                    class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold p-3 rounded transition duration-200">
                Acessar Painel
            </button>
        </form>
    </div>

</body>
</html>
