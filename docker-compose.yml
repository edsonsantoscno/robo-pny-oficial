version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=equipe@mandacarurn.com.br
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json
      - --log.level=INFO
    ports:
      # CORREÇÃO #3: Traefik mapeado diretamente nas portas padrões da VPS para validação do Let's Encrypt
      - "80:80"
      - "443:443"
      - "8080:8080" # Painel administrativo interno do Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data:/etc/traefik/
    networks:
      - pny_network
    restart: always
  saas-dashboard:
    build:
      context: ./saas_dashboard
      dockerfile: Dockerfile
    working_dir: /app
    # CORREÇÃO #2: Linha 'command' removida para respeitar o Gunicorn parametrizado no Dockerfile
    networks:
      - pny_network
    environment:
      - SUPABASE_URL=https://mandacarurn.com.br
      - SUPABASE_KEY=SEU_SUPABASE_KEY_AQUI
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saas-dashboard.rule=Host(`://mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard.entrypoints=websecure"
      - "traefik.http.routers.saas-dashboard.tls=true"
      - "traefik.http.routers.saas-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.saas-dashboard.loadbalancer.server.port=5000"
      - "traefik.http.routers.saas-dashboard-http.rule=Host(`://mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard-http.entrypoints=web"
      - "traefik.http.routers.saas-dashboard-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    volumes:
      - ./trading_state.json:/app/trading_state.json
      - ./signals.json:/app/signals.json
      - ./trading_logs.txt:/app/trading_logs.txt
  robo-trader:
    build:
      context: ./robo_trader
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_trader.py
    networks:
      - pny_network
    environment:
      - SUPABASE_URL=https://mandacarurn.com.br
      - SUPABASE_KEY=SEU_SUPABASE_KEY_AQUI
    restart: always
    volumes:
      - ./trading_state.json:/app/trading_state.json
      - ./signals.json:/app/signals.json
      - ./trading_logs_trader.txt:/app/trading_logs_trader.txt
      - ./.env.secrets:/app/.env.secrets

  robo-cliente:
    build:
      context: ./robo_cliente
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_copy_trader.py
    networks:
      - pny_network
    environment:
      - SUPABASE_URL=https://mandacarurn.com.br
      - SUPABASE_KEY=SEU_SUPABASE_KEY_AQUI
    restart: always
    volumes:
      - ./signals.json:/app/signals.json
      - ./.env.secrets:/app/.env.secrets

  websocket-server:
    build:
      context: ./websocket_server
      dockerfile: Dockerfile
    working_dir: /app
    command: python websocket_server.py
    networks:
      - pny_network
    environment:
      - SUPABASE_URL=https://mandacarurn.com.br
      - SUPABASE_KEY=SEU_SUPABASE_KEY_AQUI
      - WS_PORT=6001
    restart: always

networks:
  # CORREÇÃO #1: Criação e gerenciamento interno da rede pelo próprio docker-compose (Zero dependência externa)
  pny_network:
    driver: bridge
