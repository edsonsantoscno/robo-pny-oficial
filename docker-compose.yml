version: '3.8' # Ou a versão que você já está usando

services:
  saas-dashboard:
    build: ./saas-dashboard
    ports:
      - "80:5000"
    volumes:
      - ./state:/app/state # Monta o diretório 'state' do host no '/app/state' do dashboard
    environment:
      # ... suas variáveis de ambiente do dashboard ...
      - STATE_FILE_PATH=/app/state/trading_state.json # Passa o caminho completo para o dashboard
    depends_on:
      - robo-trader # O dashboard pode depender do trader para iniciar, se desejar

  robo-trader:
    build: ./robo-trader
    volumes:
      - ./state:/app/state # Monta o mesmo diretório 'state' do host no '/app/state' do robô mestre
    environment:
      # ... suas variáveis de ambiente do robô mestre ...
      - STATE_FILE_PATH=/app/state/trading_state.json # Passa o caminho completo para o robô mestre
    # ... outras configurações do robo-trader ...

  # ... outros serviços como robo-cliente, websocket-server, etc. ...

volumes:
  state: # Declara um volume nomeado para melhor gerenciamento pelo Docker
    driver: local
