version: '3.8'

services:
  robo_pny:
    image: python:3.9-slim
    container_name: robo_pny_oficial
    restart: always
    tty: true
    stdin_open: true
    environment:
      - KEY_BINANCE=${KEY_BINANCE}
      - SECRET_BINANCE=${SECRET_BINANCE}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    # O Docker substitui o ${GITHUB_TOKEN} de forma invisível na inicialização
    command: >
      sh -c 'apt-get update && apt-get install -y git &&
             git clone https://oauth2:\${GITHUB_TOKEN}@://github.com /app &&
             cd /app &&
             pip install --no-cache-dir -r requirements.txt &&
             python robo_trader/teste_supabase.py'
