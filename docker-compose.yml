services:
  robo-trader:
    image: robo-mestre:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - KEY_BINANCE=hpVbEaehE6CV1qqeBOWD7LzWUoIL8nUEcX2Gy5CotV9hf4P2dqxvoJORx3FLMHuu
      - SECRET_BINANCE=gu5zzrS4PAtEpAdatiLCC0AeDUJc3XENL9URaneDWPMja0D5SPjlx7mFWXsLVq45
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ewogICJyb2xlIjogImFub24iLAogICJpc3MiOiAic3VwYWJhc2UiLAogICJpYXQiOiAxNzE1MDUwODAwLAogICJleHAiOiAxODcyODE3MjAwCn0._35WSO6fSKJFx1GT0mTiALaXhEut2mVPUKcU_fBK5bw
    volumes:
      - ./data/robo_trader:/app/data/robo_trader
      - ./data/logs:/app/logs
    ports:
      - "8765:8765"
    command: python -u robo_trader/main_trader.py

  websocket-server:
    image: websocket-server:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - WEBSOCKET_HOST=0.0.0.0
      - WEBSOCKET_PORT=8765
    volumes:
      - ./data/robo_trader:/app/data/robo_trader
      - ./data/logs:/app/logs
    ports:
      - "8766:8765" # MODIFICADO: Porta externa mudou para 8766 para evitar conflito
    depends_on:
      - robo-trader

  robo-cliente:
    image: robo-cliente:latest
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - API_KEY=cole_sua_api_key_aqui
      - API_SECRET=cole_seu_api_secret_aqui
      - SUPABASE_URL=cole_sua_supabase_url_aqui
      - SUPABASE_KEY=cole_sua_supabase_key_aqui
      - WEBSOCKET_HOST=websocket-server
      - WEBSOCKET_PORT=8765
    volumes:
      - ./data/robo_cliente:/app/data/robo_cliente
      - ./data/logs:/app/logs
    depends_on:
      - websocket-server
    command: python -u robo_cliente/main_copy_trader.py

  saas-dashboard:
    image: saas-dashboard:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SUPABASE_URL=cole_sua_supabase_url_aqui
      - SUPABASE_KEY=cole_sua_supabase_key_aqui
    volumes:
      - ./data/robo_trader:/app/data/robo_trader
      - ./data/robo_cliente:/app/data/robo_cliente
      - ./data/logs:/app/logs
    command: python -u saas_dashboard/app.py
