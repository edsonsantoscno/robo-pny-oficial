services:
  robo-trader:
    build:
      context: .
      dockerfile: Dockerfile # Assumindo que o Dockerfile do robo-trader está na raiz
    container_name: robo-trader
    env_file:
      - .env
    volumes:
      - ./data/robo_trader:/app/data/robo_trader
      - ./data/logs:/app/logs
    command: python -u robo_trader/main_trader.py

  robo-cliente:
    build:
      context: .
      dockerfile: Dockerfile # Assumindo que o Dockerfile do robo-cliente está na raiz
    container_name: robo-cliente
    env_file:
      - .env
    volumes:
      - ./data/robo_cliente:/app/data/robo_cliente
      - ./data/logs:/app/logs
    command: python -u main_copy_trader.py

  websocket-server:
    build:
      context: .
      dockerfile: Dockerfile # Assumindo que o Dockerfile do websocket-server está na raiz
    container_name: websocket-server
    env_file:
      - .env
    ports:
      - "8765:8765" # Porta do WebSocket
    command: python -u websocket_server.py

  saas-dashboard:
    build:
      context: .
      dockerfile: Dockerfile # Assumindo que o Dockerfile do saas-dashboard está na raiz
    container_name: saas-dashboard
    env_file:
      - .env
    ports:
      - "5000:5000" # Porta do Flask
    volumes:
      - ./data/robo_trader:/app/data/robo_trader
      - ./data/robo_cliente:/app/data/robo_cliente
      - ./data/logs:/app/logs
    command: python -u saas_dashboard/app.py
