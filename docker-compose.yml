version: '3.8'

services:
  robo_pny:
    image: python:3.9-slim
    container_name: robo_pny_oficial
    restart: always
    tty: true
    stdin_open: true
    environment:
      - KEY_BINANCE=${KEY_BINANCE}
      - SECRET_BINANCE=${SECRET_BINANCE}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    # Chama o arquivo script que criamos para fazer todo o trabalho
    command: sh -c "find . -name 'entrypoint.sh' -exec chmod +x {} \; -exec {} \;"
