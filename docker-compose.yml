  robo-cliente:
    build:
      context: ./robo_cliente
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_copy_trader.py
    networks:
      - traefik_public
    environment:
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ewogICJyb2xlIjogImFub24iLAogICJpc3NpOiAic3VwYWJhc2UiLAogICJpYXQiOiAxNzE1MDUwODAwLAogICJleHAiOiAxODcyODE3MjAwCn0.Y88qQiKkFGs0yKxj3vwCkQAmIZ3WUQTC4Lypoi2cHCs
