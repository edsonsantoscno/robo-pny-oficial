version: '3.8'

services:
  traefik:
    image: traefik:v2.10 # Usaremos v2.10 conforme seu docker-compose.yml original
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=equipe@mandacarurn.com.br # Seu e-mail real
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json
      - --log.level=DEBUG # Nível de log para depuração
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Dashboard (opcional, para monitoramento)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data:/etc/traefik/ # Para armazenar o acme.json
    networks:
      - traefik_public
    restart: always

  saas-dashboard:
    build:
      context: ./saas_dashboard
      dockerfile: Dockerfile
    working_dir: /app
    command: python app.py
    networks:
      - traefik_public
    environment:
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ewogICJyb2xlIjogImFub24iLAogICJpc3NpOiAic3VwYWJhc2UiLAogICJpYXQiOiAxNzE1MDUwODAwLAogICJleHAiOiAxODcyODE3MjAwCn0.Y88qQiKkFGs0yKxj3vwCkQAmIZ3WUQTC4Lypoi2cHCs
      - BINANCE_API_KEY=hpVbEaehE6CV1qqeBOWD7LzWUoIL8nUEcX2Gy5CotV9hf4P2dqxvoJORx3FLMHuu
      - BINANCE_SECRET_KEY=gu5zzrS4PAtEpAdatiLCC0AeDUJc3XENL9URaneDWPMja0D5SPjlx7mFWXsLVq45
      # Adicione outras variáveis de ambiente necessárias para o dashboard
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saas-dashboard.rule=Host(`dashboard.mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard.entrypoints=websecure"
      - "traefik.http.routers.saas-dashboard.tls=true"
      - "traefik.http.routers.saas-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.saas-dashboard.loadbalancer.server.port=5000" # Porta interna do Flask app
      # Redirecionamento HTTP para HTTPS (opcional, mas recomendado)
      - "traefik.http.routers.saas-dashboard-http.rule=Host(`dashboard.mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard-http.entrypoints=web"
      - "traefik.http.routers.saas-dashboard-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  robo-trader:
    build:
      context: ./robo_trader
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_trader.py
    networks:
      - traefik_public
    environment:
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ewogICJyb2xlIjogImFub24iLAogICJpc3NpOiAic3VwYWJhc2UiLAogICJpYXQiOiAxNzE1MDUwODAwLAogICJleHAiOiAxODcyODE3MjAwCn0.Y88qQiKkFGs0yKxj3vwCkQAmIZ3WUQTC4Lypoi2cHCs
      - BINANCE_API_KEY=hpVbEaehE6CV1qqeBOWD7LzWUoIL8nUEcX2Gy5CotV9hf4P2dqxvoJORx3FLMHuu
      - BINANCE_SECRET_KEY=gu5zzrS4PAtEpAdatiLCC0AeDUJc3XENL9URaneDWPMja0D5SPjlx7mFWXsLVq45
