    #   - "traefik.http.routers.robo-cliente.tls=true"
    #   - "traefik.http.routers.robo-cliente.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.robo-cliente.loadbalancer.server.port=8501" # Porta interna do Streamlit app

  websocket-server:
    build:
      context: ./websocket_server
      dockerfile: Dockerfile
    working_dir: /app
    command: python websocket_server.py
    networks:
      - traefik_public
    environment:
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ewogICJyb2xlIjogImFub24iLAogICJpc3NpOiAic3VwYWJhc2UiLAogICJpYXQiOiAxNzE1MDUwODAwLAICJleHAiOiAxODcyODE3MjAwCn0.Y88qQiKkFGs0yKxj3vwCkQAmIZ3WUQTC4Lypoi2cHCs
