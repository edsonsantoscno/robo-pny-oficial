version: '3.8'

services:
  robo_pny:
    image: python:3.9-slim
    container_name: robo_pny_oficial
    restart: always
    tty: true
    stdin_open: true
    environment:
      - KEY_BINANCE=SUA_NOVA_KEY_BINANCE
      - SECRET_BINANCE=SUA_NOVA_SECRET_BINANCE
      - SUPABASE_URL=https://mandacarurn.com.br
      - SUPABASE_KEY=SUA_NOVA_SUPABASE_KEY
    # O Portainer já coloca os arquivos na pasta, só precisamos instalar e rodar
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python robo_trader/teste_supabase.py"
