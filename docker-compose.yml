version: '3.8' # Manter a versão, mesmo que o warning diga que é obsoleto, é boa prática

services:
  # Serviço do Robô Mestre (Trader) e WebSocket Server
  robo-trader:
    build:
      context: .
      dockerfile: Dockerfile.robo-trader # Assumindo que você tem um Dockerfile específico para o trader
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/robo_trader:/app/data/robo_trader # Para o trading_state.json e latest_signal.json
      - ./data/logs:/app/logs # Para os logs do trader
    ports:
      - "8765:8765" # Porta do WebSocket Server
    command: bash -c "python -u robo_trader/websocket_server.py & python -u robo_trader/main_trader.py"
    # Ou, se o main_trader.py inicia o websocket_server internamente:
    # command: python -u robo_trader/main_trader.py

  # Serviço do Robô Cliente (Copy Trader)
  robo-cliente:
    build:
      context: .
      dockerfile: Dockerfile.robo-cliente # Assumindo que você tem um Dockerfile específico para o cliente
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/robo_cliente:/app/data/robo_cliente # Para o trading_state_cliente.json
      - ./data/logs:/app/logs # Para os logs do cliente
    depends_on:
      - robo-trader # Garante que o trader suba antes do cliente
    command: python -u robo_cliente/main_copy_trader.py

  # Serviço do Dashboard SaaS
  saas-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.saas-dashboard # Assumindo que você tem um Dockerfile específico para o dashboard
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./data/robo_trader:/app/data/robo_trader # Para ler o estado do trader
      - ./data/robo_cliente:/app/data/robo_cliente # Para ler o estado do cliente
      - ./data/logs:/app/logs # Para ler todos os logs
    depends_on:
      - robo-trader
      - robo-cliente
    command: python -u saas_dashboard/app.py
