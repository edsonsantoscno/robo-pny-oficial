    #   - "traefik.http.routers.websocket.entrypoints=websecure"
    #   - "traefik.http.routers.websocket.tls=true"
    #   - "traefik.http.routers.websocket.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.websocket.loadbalancer.server.port=8000"
    #   - "traefik.http.services.websocket.loadbalancer.passhostheader=true"
    #   - "traefik.http.routers.websocket.middlewares=websocket-upgrade"
    #   - "traefik.http.middlewares.websocket-upgrade.headers.customrequestheaders.Upgrade=websocket"
    #   - "traefik.http.middlewares.websocket-upgrade.headers.customrequestheaders.Connection=Upgrade"


networks:
  traefik_public:
    external: true
