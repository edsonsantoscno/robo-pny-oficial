version: '3.8'

services:
  robo_pny:
    image: python:3.9-slim
    container_name: robo_pny_oficial
    restart: always
    tty: true
    stdin_open: true
    environment:
      - KEY_BINANCE=${KEY_BINANCE}
      - SECRET_BINANCE=${SECRET_BINANCE}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    # Esse comando acha o entrypoint.sh em qualquer pasta, dá permissão e o executa
    command: sh -c "SCRIPT_PATH=\$(find / -name 'entrypoint.sh' | head -n 1) && cd \$(dirname \$SCRIPT_PATH) && chmod +x entrypoint.sh && ./entrypoint.sh"
