version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=equipe@mandacarurn.com.br
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data:/etc/traefik/
    networks:
      - pny_network
    restart: always

  saas-dashboard:
    build:
      context: ./saas_dashboard
      dockerfile: Dockerfile
    working_dir: /app
    networks:
      - pny_network
    # AJUSTADO: Carrega dinamicamente o arquivo local da máquina servidora
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SECRET_KEY=${SECRET_KEY}
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saas-dashboard.rule=Host(`dashboard.mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard.entrypoints=websecure"
      - "traefik.http.routers.saas-dashboard.tls=true"
      - "traefik.http.routers.saas-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.saas-dashboard.loadbalancer.server.port=5000"
      - "traefik.http.routers.saas-dashboard-http.rule=Host(`dashboard.mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard-http.entrypoints=web"
      - "traefik.http.routers.saas-dashboard-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    volumes:
      - ./trading_state.json:/app/trading_state.json
      - ./signals.json:/app/signals.json
      - ./trading_logs.txt:/app/trading_logs.txt

  robo-trader:
    build:
      context: ./robo_trader
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_trader.py
    networks:
      - pny_network
    # AJUSTADO: Injeta dinamicamente as chaves Binance e do Supabase na memória
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - KEY_BINANCE=${KEY_BINANCE}
      - SECRET_BINANCE=${SECRET_BINANCE}
      - WS_HOST=websocket-server
      - WS_PORT=6001
    restart: always
    volumes:
      - ./trading_state.json:/app/trading_state.json
      - ./signals.json:/app/signals.json
      - ./trading_logs_trader.txt:/app/trading_logs_trader.txt

  robo-cliente:
    build:
      context: ./robo_cliente
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_copy_trader.py
    networks:
      - pny_network
    # AJUSTADO: Mapeamento dinâmico das variáveis para sincronia do copiador
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - WS_HOST=websocket-server
      - WS_PORT=6001
    restart: always
    volumes:
      - ./trading_state_cliente.json:/app/trading_state_cliente.json
      - ./signals.json:/app/signals.json
      - ./trading_logs_cliente.txt:/app/trading_logs_cliente.txt

  websocket-server:
    build:
      context: ./websocket_server
      dockerfile: Dockerfile
    working_dir: /app
    command: python websocket_server.py
    networks:
      - pny_network
    env_file:
      - .env
    environment:
      - WS_PORT=6001
    restart: always

networks:
  pny_network:
    driver: bridge
