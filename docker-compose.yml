version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=equipe@mandacarurn.com.br
      - --certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json
      - --log.level=DEBUG
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data:/etc/traefik/
    networks:
      - traefik_public
    restart: always

  saas-dashboard:
    build:
      context: ./saas_dashboard
      dockerfile: Dockerfile
    working_dir: /app
    command: python app.py
    networks:
      - traefik_public
    environment:
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=SEU_SUPABASE_KEY_AQUI
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saas-dashboard.rule=Host(`dashboard.mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard.entrypoints=websecure"
      - "traefik.http.routers.saas-dashboard.tls=true"
      - "traefik.http.routers.saas-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.saas-dashboard.loadbalancer.server.port=5000"
      - "traefik.http.routers.saas-dashboard-http.rule=Host(`dashboard.mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard-http.entrypoints=web"
      - "traefik.http.routers.saas-dashboard-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    volumes:
      - ./trading_state.json:/app/trading_state.json
      - ./signals.json:/app/signals.json
      - ./trading_logs.txt:/app/trading_logs.txt

  robo-trader:
    build:
      context: ./robo_trader
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_trader.py
    networks:
      - traefik_public
    environment:
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=SEU_SUPABASE_KEY_AQUI
    restart: always
    volumes:
      - ./trading_state.json:/app/trading_state.json
      - ./signals.json:/app/signals.json
      - ./trading_logs_trader.txt:/app/trading_logs_trader.txt
      - ./.env.secrets:/app/.env.secrets

  robo-cliente:
    build:
      context: ./robo_cliente
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_copy_trader.py
    networks:
      - traefik_public
    environment:
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=SEU_SUPABASE_KEY_AQUI
    restart: always
    volumes:
      - ./signals.json:/app/signals.json
      - ./.env.secrets:/app/.env.secrets

  websocket-server:
    build:
      context: ./websocket_server
      dockerfile: Dockerfile
    working_dir: /app
    command: python websocket_server.py
    networks:
      - traefik_public
    environment:
      - SUPABASE_URL=https://supabase.mandacarurn.com.br
      - SUPABASE_KEY=SEU_SUPABASE_KEY_AQUI
      - WEBSOCKET_PORT=8000
    restart: always
    # labels de exemplo, se quiser expor o websocket:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.websocket.rule=Host(`ws.mandacarurn.com.br`)"
    #   - "traefik.http.routers.websocket.entrypoints=websecure"
    #   - "traefik.http.routers.websocket.tls=true"
    #   - "traefik.http.routers.websocket.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.websocket.loadbalancer.server.port=8000"
    #   - "traefik.http.services.websocket.loadbalancer.passhostheader=true"
    #   - "traefik.http.routers.websocket.middlewares=websocket-upgrade"
    #   - "traefik.http.middlewares.websocket-upgrade.headers.customrequestheaders.Upgrade=websocket"
    #   - "traefik.http.middlewares.websocket-upgrade.headers.customrequestheaders.Connection=Upgrade"

networks:
  traefik_public:
    external: true
