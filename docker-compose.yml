services:
  saas-dashboard:
    build:
      context: ./saas_dashboard
      dockerfile: Dockerfile
    working_dir: /app
    # CORREÇÃO CRÍTICA: Inicializa com Gunicorn para gerenciar e entregar os arquivos CSS/JS com alta performance
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --timeout 60 app:app
    ports:
      - "5001:5000" # Canal direto: Porta 5001 da VPS conversa com o painel web
    networks:
      - pny_network
      - proxy_compartilhado
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_compartilhado"
      # TRAVADO EXPLICITAMENTE NO SUBDOMÍNIO DO ROBÔ
      - "traefik.http.routers.saas-dashboard.rule=Host(`dashboard.mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard.entrypoints=websecure"
      - "traefik.http.routers.saas-dashboard.tls=true"
      - "traefik.http.routers.saas-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.saas-dashboard.loadbalancer.server.port=5000"
      # REDIRECIONAMENTO HTTP PARA HTTPS TRAVADO NO SUBDOMÍNIO DO ROBÔ
      - "traefik.http.routers.saas-dashboard-http.rule=Host(`dashboard.mandacarurn.com.br`)"
      - "traefik.http.routers.saas-dashboard-http.entrypoints=web"
      - "traefik.http.routers.saas-dashboard-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    volumes:
      - ./trading_state.json:/app/trading_state.json
      - ./signals.json:/app/signals.json
      - ./trading_logs.txt:/app/trading_logs.txt

  robo-trader:
    build:
      context: ./robo_trader
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_trader.py
    networks:
      - pny_network
      - proxy_compartilhado
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - KEY_BINANCE=${KEY_BINANCE}
      - SECRET_BINANCE=${SECRET_BINANCE}
      - WS_HOST=websocket-server
      - WS_PORT=6001
    restart: always
    volumes:
      - ./trading_state.json:/app/trading_state.json
      - ./signals.json:/app/signals.json
      - ./trading_logs_trader.txt:/app/trading_logs_trader.txt

  robo-cliente:
    build:
      context: ./robo_cliente
      dockerfile: Dockerfile
    working_dir: /app
    command: python main_copy_trader.py
    networks:
      - pny_network
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - WS_HOST=websocket-server
      - WS_PORT=6001
    restart: always
    volumes:
      - ./trading_state_cliente.json:/app/trading_state_cliente.json
      - ./signals.json:/app/signals.json
      - ./trading_logs_cliente.txt:/app/trading_logs_cliente.txt

  websocket-server:
    build:
      context: ./websocket_server
      dockerfile: Dockerfile
    working_dir: /app
    command: python websocket_server.py
    networks:
      - pny_network
      - proxy_compartilhado
    env_file:
      - .env
    environment:
      - WS_PORT=6001
    restart: always

networks:
  pny_network:
    driver: bridge
  proxy_compartilhado:
    external: true
