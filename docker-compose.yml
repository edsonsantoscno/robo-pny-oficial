version: '3.8'
services:
  robo-trader:
    image: robo-mestre:latest
    build: 
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    ports:
      - "8765:8765"
    command: python -u robo_trader/main_trader.py

  robo-cliente:
    image: robo-cliente:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PYTHONUNBUFFERED=1
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    depends_on:
      - robo-trader
    command: python -u robo_cliente/client_cliente.py

  saas-dashboard:
    image: saas-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    command: python -u saas_dashboard/app.py
